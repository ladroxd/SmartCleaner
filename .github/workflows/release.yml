# Builds the release artifacts and publishes them as the latest GitHub release whenever a
# version tag (e.g. v3.0.0) is pushed. The release text comes from
# .github/release-notes/<tag>.md (copy TEMPLATE.md to start one).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Check the tag matches version.h
        shell: pwsh
        run: |
          $header = Get-Content version.h -Raw
          $version = [regex]::Match($header, '#define\s+APP_VERSION_STR\s+"([^"]+)"').Groups[1].Value
          $parts = foreach ($name in 'MAJOR', 'MINOR', 'PATCH') {
            [regex]::Match($header, "#define\s+APP_VERSION_$name\s+(\d+)").Groups[1].Value
          }
          if ($parts -join '.' -ne $version) {
            Write-Error "version.h is inconsistent: APP_VERSION_STR is $version but the numbers are $($parts -join '.')"
            exit 1
          }
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} doesn't match version.h version $version"
            exit 1
          }

      - name: Check the release notes exist
        shell: pwsh
        run: |
          if (-not (Test-Path ".github/release-notes/${{ github.ref_name }}.md")) {
            Write-Error "Missing .github/release-notes/${{ github.ref_name }}.md"
            exit 1
          }

      - name: Build
        run: msbuild "Temp and Bin Cleaner V2.sln" /p:Configuration=Release /p:Platform=x64 /m /nologo

      - name: Package
        shell: pwsh
        run: |
          Copy-Item "x64/Release/SmartCleaner.exe" SmartCleaner.exe
          $hash = (Get-FileHash SmartCleaner.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SmartCleaner.exe" | Out-File -Encoding ascii SmartCleaner.exe.sha256

      # A draft left by an earlier run of this tag would keep its old files, so start clean.
      - name: Remove any old draft of this release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api "repos/${{ github.repository }}/releases?per_page=100" | ConvertFrom-Json
          foreach ($release in $releases) {
            if ($release.draft -and $release.tag_name -eq "${{ github.ref_name }}") {
              gh api -X DELETE "repos/${{ github.repository }}/releases/$($release.id)"
            }
          }

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          name: SmartCleaner ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            SmartCleaner.exe
            SmartCleaner.exe.sha256
